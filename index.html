<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.title">ARI Development</title>
  <meta name="description" data-i18n-attr="content:meta.desc" content="">
  <meta name="theme-color" content="#f6f1e6">
  <link rel="icon" href="assets/img/ari-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261021b">
</head>
<body>
  <main>
    <section class="hero container" id="top">
      <div class="hero-copy">
        <h1 data-i18n="hero.title"></h1>
        <p data-i18n="hero.text"></p>
        <a class="btn btn-primary" href="#projects"><span data-i18n="hero.cta"></span><svg><use href="#i-arrow"/></svg></a>
      </div>
      <a class="hero-media" href="2/">
        <img src="assets/img/hero-building.jpg" alt="" fetchpriority="high">
        <span class="hero-sale"><span data-i18n="hero.sale"></span><svg><use href="#i-arrow"/></svg></span>
      </a>
    </section>

    <section class="features container" aria-label="Values">
      <div class="feature">
        <span class="feature-icon"><svg><use href="#i-shield"/></svg></span>
        <h3 data-i18n="feat.reliability"></h3>
        <p data-i18n="feat.reliability.text"></p>
      </div>
      <div class="feature">
        <span class="feature-icon"><svg><use href="#i-leaf"/></svg></span>
        <h3 data-i18n="feat.quality"></h3>
        <p data-i18n="feat.quality.text"></p>
      </div>
      <div class="feature">
        <span class="feature-icon"><svg><use href="#i-chart"/></svg></span>
        <h3 data-i18n="feat.investment"></h3>
        <p data-i18n="feat.investment.text"></p>
      </div>
    </section>

    <section class="project-map">
      <div class="hero-map" id="projects" role="region" data-i18n-attr="aria-label:map.label"></div>
    </section>

    <section class="container">
      <div class="trust">
        <div class="trust-copy">
          <h2 data-i18n="trust.title"></h2>
          <p data-i18n="trust.text"></p>
        </div>
        <svg class="trust-emblem" viewBox="0 0 120 140" aria-hidden="true">
          <path d="M60 4 8 22v40c0 36 22 62 52 74 30-12 52-38 52-74V22L60 4Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <path d="M38 104V58l20-12v58" fill="#c9cfc3" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M58 104V34l26 12v58" fill="#e4e7df" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M30 104h62" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <!-- Partner logos from the mockup: confirm these partnerships before going live. -->
        <ul class="partners" aria-label="Partners">
          <li class="partner partner-bog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7l9-5Z" fill="currentColor"/><path d="M12 7.5 16 10v4.5L12 17l-4-2.5V10l4-2.5Z" fill="#fff"/></svg>BANK OF GEORGIA</li>
          <li class="partner partner-tbc"><strong>TBC</strong></li>
          <li class="partner partner-remax">RE/MAX</li>
          <li class="partner partner-icon"><svg><use href="#i-building"/></svg></li>
        </ul>
      </div>
    </section>

    <section class="about container" id="about">
      <div class="about-media">
        <img src="assets/img/about.jpg" alt="" loading="lazy">
      </div>
      <div class="about-copy">
        <p class="eyebrow" data-i18n="about.eyebrow"></p>
        <h2 data-i18n="about.title"></h2>
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
        <p data-i18n="about.p3"></p>
        <p data-i18n="about.p4"></p>
      </div>
      <dl class="stats">
        <div><dt><span data-count="100">0</span>+</dt><dd data-i18n="about.families"></dd></div>
        <div><dt><span data-count="23" id="project-count">0</span></dt><dd data-i18n="about.projects"></dd></div>
        <div><dt><span data-count="2">0</span></dt><dd data-i18n="about.countries"></dd></div>
      </dl>
    </section>

    <section class="team container">
      <div class="team-copy">
        <h2 data-i18n="team.title"></h2>
        <p data-i18n="team.text"></p>
      </div>
      <video class="team-video" controls preload="none" poster="assets/img/video-poster.png">
        <source src="assets/video/ari-presentation.mp4" type="video/mp4">
      </video>
    </section>

    <section class="contacts container" id="contacts">
      <h2 data-i18n="contacts.title"></h2>
      <div class="offices">
        <article class="card office">
          <h3 data-i18n="office.tbilisi"></h3>
          <ul class="office-list">
            <li><svg><use href="#i-pin"/></svg><span data-i18n="office.tbilisi.addr"></span></li>
            <li><svg><use href="#i-phone"/></svg><a href="tel:+995551002200">+995 551 00 22 00</a></li>
            <li><svg><use href="#i-mail"/></svg><a href="mailto:info@ari.ge">info@ari.ge</a></li>
            <li><svg><use href="#i-clock"/></svg><span data-i18n="hours"></span></li>
          </ul>
          <iframe class="map" title="Tbilisi office map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
            src="https://maps.google.com/maps?q=95%20Lvovi%20St%2C%20Tbilisi&z=16&output=embed"></iframe>
        </article>
        <article class="card office">
          <h3 data-i18n="office.limassol"></h3>
          <ul class="office-list">
            <li><svg><use href="#i-pin"/></svg><span data-i18n="office.limassol.addr"></span></li>
            <li><svg><use href="#i-phone"/></svg><a href="tel:+35725055962">+357 25 05 5962</a></li>
            <li><svg><use href="#i-mail"/></svg><a href="mailto:info@cronaproperty.com">info@cronaproperty.com</a></li>
            <li><svg><use href="#i-clock"/></svg><span data-i18n="hours"></span></li>
          </ul>
          <iframe class="map" title="Limassol office map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
            src="https://maps.google.com/maps?q=21%20Andrea%20Kariolou%2C%20Limassol&z=16&output=embed"></iframe>
        </article>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/layout.js?v=20261021b"></script>
  <script src="js/i18n.js?v=20261021b"></script>
  <script src="js/projects.js?v=20261021b"></script>
  <script src="js/main.js?v=20261021b"></script>
</body>
</html>
