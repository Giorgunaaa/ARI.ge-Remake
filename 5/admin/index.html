<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ARI admin panel: ARI staff review listings, answer investor requests and manage accounts.
   One page, four sections. Real sign-in reads and writes the database (only emails in the admins
   table get in); "Open demo" runs the same screens on sample data and saves nothing. */
@font-face{font-family:"KA Sans";font-style:normal;font-weight:400 700;font-display:swap;size-adjust:88%;src:url(https://fonts.gstatic.com/s/notosansgeorgian/v49/PlIVFke5O6RzLfvNNVSitxkr76PRHBC4Ytyq-Gof7PUs4S7zcGyUkdjo.woff2) format("woff2");unicode-range:U+0589,U+10A0-10FF,U+1C90-1CBA,U+1CBD-1CBF,U+205A,U+2D00-2D2F,U+2E31}
:root{
  --navy:#1A3732;--navy-2:#24463F;--on-navy:#FFF8E8;--on-navy-2:#CFC8B4;--navy-line:rgba(241,226,191,.16);
  --champ:#F1E2BF;--gold:#E3B860;--bg:#F6F2E7;--card:#FFFFFF;--band:#F3EEDF;--line:#E4DDC8;--line-2:#CFC6AC;
  --ink:#16211E;--ink-2:#3F4A46;--ink-3:#6E776F;--ok:#1F7A53;--ok-bg:#E3F3EA;--wait:#8A6A16;--wait-bg:#FBF1D2;--no:#B4452B;--no-bg:#FBE6DF;
  --f-display:"Bricolage Grotesque","KA Sans",system-ui,sans-serif;--f-body:"Hanken Grotesk","KA Sans",system-ui,sans-serif;
  --shadow:0 10px 30px -14px rgba(20,40,34,.35);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:disabled{opacity:.55;cursor:default}
.btn-primary{background:var(--navy);color:var(--on-navy)}
.btn-primary:hover{background:var(--navy-2)}
.btn-gold{background:var(--champ);color:var(--navy)}
.btn-gold:hover{background:#E7D3A6}
.btn-line{background:var(--card);border-color:var(--line-2)}
.btn-line:hover{border-color:var(--ink-3)}
.btn-no{background:var(--card);border-color:#E3B3A6;color:var(--no)}
.btn-no:hover{background:var(--no-bg)}
.btn-sm{min-height:34px;padding:0 12px;font-size:13.5px}

/* sign-in */
.login{min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:var(--navy)}
.login-card{width:min(420px,100%);background:var(--card);border-radius:18px;padding:28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px}
.brand svg{width:34px;height:34px;flex:none}
.brand small{display:block;font:500 12px var(--f-body);color:var(--ink-3);letter-spacing:.02em}
.fg{display:grid;gap:6px}
.fg label{font-size:13px;font-weight:600;color:var(--ink-2)}
.fg input,.field{width:100%;min-height:44px;padding:0 13px;border-radius:10px;border:1px solid var(--line-2);background:#fff}
textarea.field{padding:10px 13px;min-height:96px;resize:vertical}
.err{color:var(--no);font-size:13.5px}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.hint{font-size:13px;color:var(--ink-3)}
.lang{display:inline-flex;padding:3px;border-radius:10px;background:rgba(0,0,0,.06);border:1px solid var(--line)}
.lang button{border:0;background:none;font-size:12.5px;font-weight:700;letter-spacing:.04em;min-height:28px;padding:0 9px;border-radius:7px;cursor:pointer;color:var(--ink-3)}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.top .lang{background:rgba(255,255,255,.08);border-color:var(--navy-line)}
.top .lang button{color:var(--on-navy-2)}
.top .lang button[aria-pressed="true"]{background:var(--champ);color:var(--navy)}

/* shell */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:var(--on-navy)}
.top-row{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.top .brand{color:var(--on-navy);margin-right:auto}
.top .brand small{color:var(--on-navy-2)}
.who{font-size:13px;color:var(--on-navy-2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .btn-line{background:none;border-color:rgba(255,255,255,.3);color:var(--on-navy)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--on-navy-2);font-weight:600;font-size:14.5px;padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--on-navy);background:rgba(255,255,255,.06)}
.tabs button[aria-current="page"]{color:var(--navy);background:var(--champ)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--gold);color:var(--navy)}
.demo-bar{background:var(--wait-bg);color:var(--wait);font-size:13.5px;font-weight:600;text-align:center;padding:8px 16px;border-bottom:1px solid #EBD99A}
main{padding:26px 0 70px}
.page-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head h1{font-size:clamp(1.5rem,2.6vw,2rem)}
.page-head p{color:var(--ink-3);font-size:14px;margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:2px;text-align:left;cursor:pointer}
.stat:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.stat span{font-size:13px;color:var(--ink-3)}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:600}
.stat.hot b{color:var(--no)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:16px}
.empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:14px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:var(--band);border:1px solid var(--line)}
.seg button{border:0;background:none;font-weight:600;font-size:13.5px;padding:7px 12px;border-radius:9px;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg i{font-style:normal;font-size:12px;color:var(--ink-3)}
.search{flex:1;min-width:200px;max-width:340px;margin-left:auto}

.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:76px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%;cursor:pointer}
.row:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.row.flat{cursor:default}
.row.flat:hover{box-shadow:none;border-color:var(--line)}
.thumb{width:76px;height:58px;border-radius:10px;object-fit:cover;background:var(--band);display:block}
.r-main b{display:block;font-size:15px}
.r-main span,.r-col span{display:block;font-size:13px;color:var(--ink-3)}
.r-col b{display:block;font-size:14px;font-weight:600}
.row.req{grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) minmax(0,1fr) auto}
.row.usr{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.8fr) auto}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.more{display:flex;justify-content:center;margin-top:16px}
.more i{font-style:normal;font-weight:500;color:var(--ink-3)}
.r-col span.pill,.r-main span.pill{display:inline-flex;margin-top:4px}
/* inside the two overview panels the rows are narrow: keep the essentials */
.panel .row{grid-template-columns:64px minmax(0,1fr) auto}
.panel .row .r-col{display:none}
.panel .row .thumb{width:64px;height:52px}
.panel .row.req{grid-template-columns:1fr;gap:8px}
.panel .row.req .r-col{display:block}
.panel .acts{justify-content:flex-start}
.msg{margin-top:6px;padding:8px 10px;border-radius:9px;background:var(--band);font-size:13.5px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-wait{background:var(--wait-bg);color:var(--wait)}.p-ok{background:var(--ok-bg);color:var(--ok)}.p-no{background:var(--no-bg);color:var(--no)}.p-off{background:var(--band);color:var(--ink-3)}.p-day{background:var(--gold);color:var(--navy)}

/* listing window */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.modal-back{position:absolute;inset:0;background:rgba(10,20,17,.6)}
.modal-card{position:relative;width:min(860px,100%);max-height:calc(100svh - 32px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.55)}
.m-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.m-head h2{font-size:19px;margin-right:auto}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);font-size:20px;line-height:1;cursor:pointer}
.m-body{display:grid;gap:18px;padding:20px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal a{display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--band)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0}
.dl div{background:var(--card);padding:10px 12px;min-width:0}
.dl dt{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.dl dd{margin:2px 0 0;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.box h3{font-size:14px;font-family:var(--f-body);font-weight:700;color:var(--ink-2)}
.box p{font-size:14.5px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.box.note{background:var(--no-bg);border-color:#EFC7BC}
.m-foot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;padding:14px 20px;background:var(--card);border-top:1px solid var(--line)}
.m-foot .grow{margin-right:auto}
/* user window: who this is, then what they listed (developer) or asked about (investor) */
.row.usr.open{cursor:pointer}
.row.usr.open:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.u-head{display:flex;align-items:center;gap:14px}
.u-ava{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--champ);font:700 19px var(--f-display)}
.u-head b{display:block;font:600 20px/1.2 var(--f-display)}
.u-head div span{display:block;font-size:14px;color:var(--ink-3)}
.u-sum{display:flex;flex-wrap:wrap;gap:6px}
.mini{display:grid;gap:8px}
.mini .row{grid-template-columns:64px minmax(0,1fr) auto;padding:10px 12px}
.mini .row.noimg{grid-template-columns:minmax(0,1fr) auto;align-items:start}
.mini .thumb{width:64px;height:52px}
.reject{display:grid;gap:8px;width:100%}
.toast{position:fixed;left:0;right:0;bottom:20px;margin-inline:auto;width:fit-content;max-width:min(92vw,520px);z-index:80;background:var(--navy);color:var(--on-navy);padding:12px 18px;border-radius:12px;box-shadow:0 14px 40px -10px rgba(0,0,0,.5);font-size:14.5px}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
  .row{grid-template-columns:64px minmax(0,1fr) auto}
  .row .r-col{display:none}
  .row.req,.row.usr{grid-template-columns:1fr}
  .row.req .r-col,.row.usr .r-col{display:block}
  .acts{justify-content:flex-start}
  .thumb{width:64px;height:52px}
  .dl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{max-width:none;margin-left:0;flex-basis:100%}
  .who{display:none}
}
</style>
</head>
<body>

<!-- ============ SIGN IN ============ -->
<div class="login" id="login">
  <form class="login-card" id="loginForm" novalidate>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div class="brand"><svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#F1E2BF"/><g transform="translate(5 10.3) scale(.049)"><path fill="#1A3732" d="M188.21 191.22L173.64 194.09L193.97 241.12L210.11 241.12ZM110.34 33.68L112.46 39.08L156.07 149.85L170.27 147.15L110.68 0L0 273.47L14.34 273.47L108.18 39.07ZM390.57 33.33C382.23 27.03 372.88 22.35 362.78 19.42C352.61 16.46 342.22 14.96 331.91 14.96L270.01 14.96L270.01 127.62L284.81 124.83L284.81 31.27L284.81 28.96L287.11 28.96L334.67 28.96C344.88 28.96 354.38 30.69 362.89 34.09C371.31 37.49 378.63 42.19 384.65 48.07C390.67 53.95 395.31 60.81 398.45 68.47C401.59 76.11 403.18 84.4 403.18 93.11C403.18 96.27 402.97 99.43 402.55 102.57L418.11 99.62C418.29 97.26 418.38 94.85 418.38 92.32C418.38 78.76 415.81 66.98 410.73 57.33C405.62 47.64 398.84 39.56 390.57 33.33M475.13 42.08L475.13 80.22L489.95 77.41L489.95 42.08ZM479.02 134.1L478.81 134.14L478.79 134.14L475.13 134.87L475.13 241.13L489.95 241.13L489.95 132.04L483.22 133.31ZM69.46 183.22L63.58 198.12L161.5 178.88L382.86 135.31L383.08 135.27L383.11 135.27L387.11 134.52L400.91 131.9C403.06 129.97 405.16 127.84 407.15 125.59C409.86 122.46 412.3 119.09 414.42 115.52L408.28 116.69ZM284.8 172.25L270.01 175.16L270.01 241.13L284.8 241.13ZM347.09 160.09L396.1 241.12L413.49 241.12L362.92 157.11Z"/></g></svg><span>ARI<small data-t="adminPanel"></small></span></div>
      <div class="lang" role="group" aria-label="Language / ენა"><button type="button" data-lang="ka">KA</button><button type="button" data-lang="en">EN</button></div>
    </div>
    <h1 style="font-size:22px" data-t="signInTitle"></h1>
    <div class="fg"><label for="email" data-t="email"></label><input id="email" type="email" autocomplete="username" required></div>
    <div class="fg"><label for="pass" data-t="password"></label><input id="pass" type="password" autocomplete="current-password" required></div>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn btn-primary" type="submit" id="loginBtn" data-t="signIn"></button>
    <div class="or" data-t="or"></div>
    <button class="btn btn-gold" type="button" id="demoBtn" data-t="openDemo"></button>
    <p class="hint" data-t="demoHint"></p>
  </form>
</div>

<!-- ============ PANEL ============ -->
<div id="app" hidden>
  <header class="top">
    <div class="wrap top-row">

  /* The panel never downloads whole tables. Each screen asks the database for the numbers on the tabs and for

  var S = { tab:'overview', demo:false, email:'', lf:'in_review', lq:'', rf:'new', uf:'developer', seq:0,

  var DEMO = null, STEP = 20;

  function byId(list, id){ for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) return list[i]; return null; }
  function who(id){ return byId(S.data.profiles, id) || {}; }

    return rows.map(function(r){
      var o = byId(cache, r.id);

      return o;
    });
  }
  function need(table, cache, ids){   /* fetch the rows with these ids that we don't hold yet */

    if (S.demo){ upsert(cache, DEMO[table === 'platform_profiles' ? 'profiles' : 'listings'].filter(function(r){ return ids.indexOf(r.id) > -1; })); return Promise.resolve(); }
    return sb.from(table).select('*').in('id', ids).then(function(res){ upsert(cache, res.data || []); }, function(){});
  }
  function cnt(table, fn){

  }

  function leave(){ S.demo = false; S.email = ''; S.seq++; S.list = null; S.counts = {}; DEMO = null; S.data = { listings:[], profiles:[], interests:[] }; closeModal(); $('#app').hidden = true; $('#login').hidden = false; $('#pass').value = ''; render(); }
  function startReal(email){
    return sb.rpc('is_admin').then(function(res){
      if (res.error || res.data !== true){ return sb.auth.signOut().then(function(){ throw new Error('notAdmin'); }, function(){ throw new Error('notAdmin'); }); }
      S.demo = false; S.email = email; enter();
    });
  }
  $('#loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var email = $('#email').value.trim(), pass = $('#pass').value, btn = $('#loginBtn');
    if (!email || !pass){ showErr('needBoth'); return; }
    if (!sb){ showErr('offline'); return; }
    showErr(''); btn.disabled = true;
    sb.auth.signInWithPassword({ email:email, password:pass }).then(function(res){
      if (res.error) throw new Error(/invalid login/i.test(res.error.message) ? 'wrongLogin' : 'offline');
      return startReal(email);
    }).then(function(){ btn.disabled = false; }, function(err){ btn.disabled = false; showErr(T.en[err && err.message] ? err.message : 'offline'); });
  });
  $('#demoBtn').addEventListener('click', function(){ S.demo = true; S.email = ''; DEMO = demoData(); showErr(''); enter(); });
  $('#outBtn').addEventListener('click', function(){
    if (S.demo || !sb){ leave(); return; }
    sb.auth.signOut().then(leave, leave);
  });

  /* ---------- Boot: come back signed in if the browser still has the session ---------- */
  render();
  var want = /^#demo(?:\/(listings|requests|users))?$/.exec(location.hash);   /* admin/#demo opens the sample panel straight away */
  if (want){ S.demo = true; DEMO = demoData(); enter(); if (want[1]){ S.tab = want[1]; if (want[1] !== 'users'){ S.lf = 'all'; S.rf = 'all'; } show(); } }
  else if (sb) sb.auth.getSession().then(function(res){
    var u = res.data && res.data.session && res.data.session.user;
    if (u) startReal(u.email).then(null, function(){ render(); });
  }, function(){});
})();
</script>
</body>
</html>
