# Supabase-ის უფასო პროექტი ჩერდება, თუ კვირა ბაზას არავინ მიმართავს.
# დღეში ერთხელ ვკითხულობთ ერთ ჩანაწერს, რომ პროექტი აქტიური დარჩეს.
# URL და anon key — 2/sales.js-იდან (key საჯაროა, საიტიც იმავეს იყენებს).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *"   # ყოველდღე 06:17 UTC
  workflow_dispatch:

# მხოლოდ რეპოს წაკითხვა; GitHub-ის ტოკენი დისკზე არ რჩება
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read one row
        run: |
          URL=$(grep -oP "const URL = '\K[^']+" 2/sales.js)
          KEY=$(grep -oP "const KEY = '\K[^']+" 2/sales.js)
          curl --fail --silent --show-error --max-time 30 \
            "$URL/rest/v1/units?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
      # მეორე პროექტი: საინვესტიციო პლატფორმა (designhub.ge/5). URL და საჯარო key — 5/index.html-იდან.
      - name: Read one row (investment platform)
        run: |
          URL=$(grep -oP "SB_URL = '\K[^']+" 5/index.html)
          KEY=$(grep -oP "SB_KEY = '\K[^']+" 5/index.html)
          curl --fail --silent --show-error --max-time 30 \
            "$URL/rest/v1/platform_listings?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
